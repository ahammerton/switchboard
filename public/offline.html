<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switchboard is offline</title>
  <style>
    :root { --bg: #f4f5f8; --text: #0f172a; --muted: #64748b; --accent: #6366f1; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0d12; --text: #e6e8ee; --muted: #8b93a7; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 20px; margin: 16px 0 4px; }
    p { color: var(--muted); margin: 0 0 20px; max-width: 32em; }
    button { font: inherit; padding: 8px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg width="72" height="72" viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="112" fill="#6366f1"/>
      <g fill="#fff"><rect x="112" y="112" width="128" height="128" rx="30"/><rect x="272" y="112" width="128" height="128" rx="30" fill-opacity=".72"/><rect x="112" y="272" width="128" height="128" rx="30" fill-opacity=".72"/><rect x="272" y="272" width="128" height="128" rx="30"/></g>
    </svg>
    <h1>Can't reach Switchboard</h1>
    <p>The dashboard's server isn't answering. Check that you're on your home network (or VPN) and that the server is running.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
