# Runs the tests on every supported Python version, then builds the image for
# amd64 and arm64 and publishes it to GitHub's container registry as
# ghcr.io/<owner>/switchboard, and to Docker Hub as cyrune/switchboard when the
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are set. Nothing is published
# if any test fails.
#   push to main      -> :latest and :sha-<short sha>
#   tag v1.2.3        -> :1.2.3, :1.2 and :1
#   pull request      -> build only, nothing published
name: docker
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    # GitHub only: the Gitea mirror could also run .github/workflows, but can't publish.
    # (The image job needs this one, so it's skipped too.)
    if: github.repository_owner == 'ahammerton'
    # Ubuntu 26.04 (ubuntu-latest since October 2026) has no Python 3.9, so 3.9 runs on 24.04.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Front-end syntax
        run: node --check public/app.js && node --check public/sw.js

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/switchboard
            name=docker.io/cyrune/switchboard,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Switchboard
            org.opencontainers.image.description=A small, self-hosted start page for your home lab

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub's repository page: a short overview (the README's screenshots use
      # relative links, which Docker Hub can't show).
      - name: Docker Hub description
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cyrune/switchboard
          short-description: A small, self-hosted start page for your home lab
          readme-filepath: ./docs/DOCKERHUB.md
